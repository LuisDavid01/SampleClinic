
services:
  # Chat API (Go)
  clinica-chat-api:
    container_name: clinica-chat-api
    image: clinica/chat-api:latest
    ports:
      - "8081:8081"
    env_file:
      - .env
      
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chat-network:
    driver: bridge
