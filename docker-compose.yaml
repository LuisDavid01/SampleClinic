services:
  clinica-nextjs:
    container_name: clinica-nextjs
    build: ./clinica-nextjs
    ports:
      - "3000:3000"
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    networks:
      - app-network
  clinica-chat:
    container_name: clinica-chat
    build:
      context: ./clinica-chat-api
    ports:
      - "8080:8080"
    networks:
      - app-network
  
  clinica-api:
    container_name: clinica-api
    build:
      context: ./clinica-api
    ports:
      - "42069:42069"
    networks:
      - app-network
  #clinica-web:
    #container_name: clinica-web
    #build:
    #  context: ./clinica-web
    #ports:
    #  - "5173:5173"
    #networks:
     # - app-network


networks:
  app-network:
    driver: bridge
