# Docker Compose para Clínica API
# Para configurar variables de entorno, crea un archivo .env o edita las variables directamente

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: salena_fisio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker-init-mejorado.sql:/docker-entrypoint-initdb.d/docker-init-mejorado.sql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salena_fisio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # API de la clínica
  clinica-api:
    container_name: clinica-api
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:CHANGE_ME_DB_PASSWORD@postgres:5432/salena_fisio?schema=public"
      JWT_SECRET: "CHANGE_ME"
      JWT_EXPIRES_IN: "7d"
      CLERK_SECRET_KEY: "sk_test_REVOKED"
      CLERK_PUBLISHABLE_KEY: "pk_test_dG91Y2hpbmctbWFsbGFyZC04NC5jbGVyay5hY2NvdW50cy5kZXYk"
      PORT: 3001
      NODE_ENV: "production"
      CORS_ORIGIN: "http://localhost:3000"
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@clinicaestebanporras.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Clínica Esteban Porras}
      # Frontend URL (para links de confirmación)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Configuración de Recordatorios
      RECORDATORIO_DIAS_ANTES: ${RECORDATORIO_DIAS_ANTES:-2}
      CRON_SCHEDULE_RECORDATORIOS: ${CRON_SCHEDULE_RECORDATORIOS:-0 9 * * *}
      # Timezone para cron jobs
      TZ: ${TZ:-America/Costa_Rica}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
