apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-web
  labels:
    app: clinica-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinica-web
  template:
    metadata:
      labels:
        app: clinica-web
    spec:
      containers:
        - name: clinica-web
          image: luisdavid01/clinicanextjs:latest 
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: PORT
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_API_BASE_URL
            - name: NEXT_PUBLIC_CHAT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_CHAT_API_BASE_URL
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: clinica-web-configmap
                  key: NEXT_PUBLIC_WS_URL 
