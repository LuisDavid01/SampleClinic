apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webclinica-httproute
spec:
  parentRefs:
    - name: clinica-gateway
      sectionName: https-clinica
  hostnames:
    - "clinica.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-service
          port: 3000
