apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clinicaapi-httproute
spec:
  parentRefs:
    - name: clinica-gateway
  hostnames:
    - "clinica.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: clinicaapi-service
          port: 8082
